name: Build Jarvis APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Add project files
        run: |
          cd JarvisApp
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Jarvis"
          include(":app")
          EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF'
          plugins {
          id("com.android.application") version "8.5.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          kotlin.code.style=official
          EOF
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF'
          plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
          }
          android {
          namespace = "com.jarvis.app"
          compileSdk = 34
          defaultConfig {
          applicationId = "com.jarvis.app"
          minSdk = 26
          targetSdk = 34
          versionCode = 2
          versionName = "2.0"
          }
          compileOptions {
          sourceCompatibility = JavaVersion.VERSION_17
          targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = "17" }
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.CALL_PHONE"/>
          <uses-permission android:name="android.permission.SEND_SMS"/>
          <uses-permission android:name="android.permission.READ_CONTACTS"/>
          <uses-permission android:name="android.permission.SET_ALARM"/>
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
          <queries>
          <intent>
          <action android:name="android.intent.action.MAIN"/>
          <category android:name="android.intent.category.LAUNCHER"/>
          </intent>
          <intent><action android:name="android.speech.RecognitionService"/></intent>
          <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
          </queries>
          <application android:label="Jarvis" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true">
          <intent-filter>
          <action android:name="android.intent.action.MAIN"/>
          <category android:name="android.intent.category.LAUNCHER"/>
          </intent-filter>
          </activity>
          <service android:name=".JarvisService" android:exported="false"
          android:foregroundServiceType="microphone"/>
          </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/jarvis/app/JarvisService.kt)
          cat > app/src/main/java/com/jarvis/app/JarvisService.kt <<'EOF'
          package com.jarvis.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.SpeechRecognizer

          class JarvisService : Service(), RecognitionListener {
          private lateinit var jarvis: Jarvis
          private var sr: SpeechRecognizer? = null
          private val h = Handler(Looper.getMainLooper())
          private var awaiting = false
          private var alive = true
          private val wake = listOf("jarvis", "\u0B9C\u0BBE\u0BB0\u0BCD\u0BB5\u0BBF\u0BB8\u0BCD", "\u0B9C\u0BBE\u0BB0\u0BCD\u0BB5\u0BBF\u0B9A\u0BCD", "\u0B9C\u0BBE\u0BB0\u0BCD\u0BB5\u0BC0\u0BB8\u0BCD")

          override fun onCreate() {
          super.onCreate()
          getSystemService(NotificationManager::class.java)
          .createNotificationChannel(NotificationChannel("j", "Jarvis", NotificationManager.IMPORTANCE_LOW))
          val n = Notification.Builder(this, "j").setContentTitle("Jarvis kekkuthu: 'Hey Jarvis'")
          .setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
          if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
          else startForeground(1, n)
          jarvis = Jarvis(this) {}
          listen()
          }

          private fun listen() {
          if (!alive) return
          if (jarvis.speaking()) { h.postDelayed({ listen() }, 500); return }
          sr?.destroy()
          val lang = getSharedPreferences("jarvis", 0).getString("lang", "ta-IN") ?: "ta-IN"
          sr = SpeechRecognizer.createSpeechRecognizer(this).also {
          it.setRecognitionListener(this)
          it.startListening(recognizerIntent(lang))
          }
          }

          override fun onResults(b: Bundle?) {
          val all = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION).orEmpty().map { it.lowercase() }
          val first = all.firstOrNull().orEmpty()
          val hit = all.firstOrNull { r -> wake.any { r.contains(it) } }
          if (awaiting && first.isNotBlank()) { awaiting = false; jarvis.handle(first) }
          else if (hit != null) {
          val w = wake.first { hit.contains(it) }
          val cmd = hit.substringAfter(w).trim().trimStart(',').trim()
          if (cmd.isEmpty()) { awaiting = true; jarvis.say("Yes boss?") } else jarvis.handle(cmd)
          }
          h.postDelayed({ listen() }, 600)
          }

          override fun onError(error: Int) { h.postDelayed({ listen() }, 800) }
          override fun onReadyForSpeech(p: Bundle?) {}
          override fun onBeginningOfSpeech() {}
          override fun onRmsChanged(v: Float) {}
          override fun onBufferReceived(b: ByteArray?) {}
          override fun onEndOfSpeech() {}
          override fun onPartialResults(p: Bundle?) {}
          override fun onEvent(t: Int, p: Bundle?) {}
          override fun onBind(i: Intent?): IBinder? = null

          override fun onDestroy() {
          alive = false
          sr?.destroy()
          jarvis.shutdown()
          super.onDestroy()
          }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/jarvis/app/OrbView.kt)
          cat > app/src/main/java/com/jarvis/app/OrbView.kt <<'EOF'
          package com.jarvis.app

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.sin

          class OrbView(c: Context) : View(c) {
          var state = 0      // 0 idle, 1 listening, 2 thinking
          var level = 0f     // 0..1 mic loudness
          private val p = Paint(Paint.ANTI_ALIAS_FLAG)
          private var t = 0f

          init {
          ValueAnimator.ofFloat(0f, 6.2832f).apply {
          duration = 2000; repeatCount = ValueAnimator.INFINITE; interpolator = LinearInterpolator()
          addUpdateListener { t = it.animatedValue as Float; invalidate() }
          }.start()
          }

          override fun onDraw(cv: Canvas) {
          val cx = width / 2f; val cy = height / 2f
          val base = minOf(width, height) * 0.2f
          val col = when (state) { 1 -> 0xFF00E5FF.toInt(); 2 -> 0xFFFFB300.toInt(); else -> 0xFF3D7BFF.toInt() }
          val speed = if (state == 2) 3f else 1f
          for (i in 3 downTo 1) {
          val r = base * (1f + i * 0.3f) * (1f + 0.06f * sin(t * speed + i) + level * 0.5f)
          p.shader = null; p.color = col; p.alpha = 25 + (3 - i) * 12
          cv.drawCircle(cx, cy, r, p)
          }
          val core = base * (1f + level * 0.3f)
          p.shader = RadialGradient(cx, cy, core, 0xFFFFFFFF.toInt(), col, Shader.TileMode.CLAMP)
          p.alpha = 255
          cv.drawCircle(cx, cy, core, p)
          }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/jarvis/app/MainActivity.kt)
          cat > app/src/main/java/com/jarvis/app/MainActivity.kt <<'EOF'
          package com.jarvis.app

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.SpeechRecognizer
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
          private lateinit var jarvis: Jarvis
          private lateinit var orb: OrbView
          private lateinit var reply: TextView
          private var sr: SpeechRecognizer? = null
          private var camQ = ""

          override fun onCreate(b: Bundle?) {
          super.onCreate(b)
          val prefs = getSharedPreferences("jarvis", 0)
          val dp = resources.displayMetrics.density
          fun px(v: Int) = (v * dp).toInt()
          val cyan = 0xFF00E5FF.toInt()
          val root = LinearLayout(this).apply {
          orientation = LinearLayout.VERTICAL
          setBackgroundColor(0xFF05070D.toInt()); setPadding(px(16), px(40), px(16), px(16))
          }
          reply = TextView(this).apply {
          text = "Orb-a thattunga, pesunga"; setTextColor(0xFFCFE8FF.toInt())
          textSize = 17f; gravity = Gravity.CENTER; minLines = 3
          }
          orb = OrbView(this)
          jarvis = Jarvis(this) { reply.text = it; orb.state = 0; orb.level = 0f }
          fun run(t: String) { if (t.isNotBlank()) { orb.state = 2; jarvis.handle(t) } }

          fun btn(t: String, f: (Button) -> Unit) = Button(this).apply {
          text = t; setTextColor(cyan); setBackgroundColor(0xFF0D1522.toInt()); setOnClickListener { f(this) }
          }
          fun row(vararg v: View) = LinearLayout(this).apply {
          v.forEach { addView(it, LinearLayout.LayoutParams(0, -2, 1f)) }
          }
          fun langLabel() = "Lang: " + if (prefs.getString("lang", "ta-IN") == "ta-IN") "TA" else "EN"

          val cmd = EditText(this).apply { hint = "Type command..."; setHintTextColor(0xFF607080.toInt()); setTextColor(0xFFFFFFFF.toInt()) }
          val key = EditText(this).apply {
          hint = "Gemini API key"; setHintTextColor(0xFF607080.toInt()); setTextColor(0xFFFFFFFF.toInt())
          setText(prefs.getString("key", "")); visibility = if (text.isBlank()) View.VISIBLE else View.GONE
          }

          orb.setOnClickListener { listenOnce(prefs.getString("lang", "ta-IN") ?: "ta-IN") }
          jarvis.onCamera = { q ->
          camQ = q
          startActivityForResult(Intent(MediaStore.ACTION_IMAGE_CAPTURE), 7)
          }

          root.addView(reply)
          root.addView(orb, LinearLayout.LayoutParams(-1, 0, 1f))
          root.addView(row(
          btn("Camera") { jarvis.onCamera?.invoke(cmd.text.toString()) },
          btn(langLabel()) { prefs.edit().putString("lang", if (prefs.getString("lang", "ta-IN") == "ta-IN") "en-IN" else "ta-IN").apply(); it.text = langLabel() },
          btn("Key") {
          if (key.visibility == View.VISIBLE) { prefs.edit().putString("key", key.text.toString().trim()).apply(); key.visibility = View.GONE; reply.text = "Key saved" }
          else key.visibility = View.VISIBLE
          }))
          root.addView(row(
          btn("Wake ON") { startForegroundService(Intent(this, JarvisService::class.java)); reply.text = "'Hey Jarvis' kekkuthu" },
          btn("Wake OFF") { stopService(Intent(this, JarvisService::class.java)) },
          btn("Overlay") { startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))) }))
          root.addView(key)
          root.addView(row(cmd, btn("Send") { run(cmd.text.toString()); cmd.setText("") }))
          setContentView(root)

          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.CALL_PHONE,
          Manifest.permission.SEND_SMS, Manifest.permission.READ_CONTACTS, Manifest.permission.POST_NOTIFICATIONS), 1)
          }

          private fun listenOnce(lang: String) {
          stopService(Intent(this, JarvisService::class.java))
          if (!SpeechRecognizer.isRecognitionAvailable(this)) return jarvis.say("Google speech service illa")
          sr?.destroy()
          sr = SpeechRecognizer.createSpeechRecognizer(this)
          sr!!.setRecognitionListener(object : RecognitionListener {
          override fun onResults(b: Bundle?) {
          val t = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull().orEmpty()
          reply.text = t; orb.state = 2; orb.level = 0f; jarvis.handle(t)
          }
          override fun onError(e: Int) { orb.state = 0; orb.level = 0f; reply.text = "Kekala, thirumba sollunga" }
          override fun onRmsChanged(v: Float) { orb.level = ((v + 2f) / 12f).coerceIn(0f, 1f) }
          override fun onReadyForSpeech(p: Bundle?) { orb.state = 1 }
          override fun onBeginningOfSpeech() {}
          override fun onBufferReceived(b: ByteArray?) {}
          override fun onEndOfSpeech() {}
          override fun onPartialResults(p: Bundle?) {}
          override fun onEvent(t: Int, p: Bundle?) {}
          })
          sr!!.startListening(recognizerIntent(lang))
          }

          @Suppress("DEPRECATION")
          override fun onActivityResult(req: Int, res: Int, data: Intent?) {
          super.onActivityResult(req, res, data)
          val bmp = data?.extras?.get("data") as? Bitmap
          if (req == 7 && res == RESULT_OK && bmp != null) { orb.state = 2; jarvis.askImage(bmp, camQ) }
          }

          override fun onDestroy() { sr?.destroy(); jarvis.shutdown(); super.onDestroy() }
          }
          EOF
      - name: Build APK
        working-directory: JarvisApp
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: JarvisApp/app/build/outputs/apk/debug/app-debug.apk
