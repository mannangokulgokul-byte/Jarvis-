name: Build Jarvis APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Add project files
        run: |
          cd JarvisApp
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Jarvis"
          include(":app")
          EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF'
          plugins {
          id("com.android.application") version "8.5.2" apply false
          id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF'
          plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
          }
          android {
          namespace = "com.jarvis.app"
          compileSdk = 34
          defaultConfig {
          applicationId = "com.jarvis.app"
          minSdk = 26
          targetSdk = 34
          versionCode = 4
          versionName = "4.0"
          }
          compileOptions {
          sourceCompatibility = JavaVersion.VERSION_17
          targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
          implementation("ai.picovoice:porcupine-android:3.0.3")
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.CALL_PHONE"/>
          <uses-permission android:name="android.permission.SEND_SMS"/>
          <uses-permission android:name="android.permission.READ_CONTACTS"/>
          <uses-permission android:name="android.permission.SET_ALARM"/>
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
          <queries>
          <intent>
          <action android:name="android.intent.action.MAIN"/>
          <category android:name="android.intent.category.LAUNCHER"/>
          </intent>
          <intent><action android:name="android.speech.RecognitionService"/></intent>
          <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH"/></intent>
          <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
          </queries>
          <application android:label="Jarvis" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask">
          <intent-filter>
          <action android:name="android.intent.action.MAIN"/>
          <category android:name="android.intent.category.LAUNCHER"/>
          </intent-filter>
          </activity>
          <service android:name=".JarvisService" android:exported="false"
          android:foregroundServiceType="microphone"/>
          </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/jarvis/app/JarvisService.kt)
          cat > app/src/main/java/com/jarvis/app/JarvisService.kt <<'EOF'
          package com.jarvis.app

          import ai.picovoice.porcupine.Porcupine
          import ai.picovoice.porcupine.PorcupineManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper

          class JarvisService : Service() {
          private var manager: PorcupineManager? = null
          private val h = Handler(Looper.getMainLooper())

          private fun note(text: String): Notification =
          Notification.Builder(this, "j").setContentTitle(text)
          .setSmallIcon(android.R.drawable.ic_btn_speak_now).build()

          private fun show(text: String) =
          getSystemService(NotificationManager::class.java).notify(1, note(text))

          override fun onCreate() {
          super.onCreate()
          getSystemService(NotificationManager::class.java)
          .createNotificationChannel(NotificationChannel("j", "Jarvis", NotificationManager.IMPORTANCE_LOW))
          val n = note("Jarvis kekkuthu: 'Jarvis' nu sollunga")
          if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
          else startForeground(1, n)
          begin()
          }

          private fun begin() {
          val key = getSharedPreferences("jarvis", 0).getString("pkey", "").orEmpty()
          if (key.isBlank()) { show("Picovoice key illa. App-la Key button-la podunga"); return }
          try {
          manager = PorcupineManager.Builder()
          .setAccessKey(key)
          .setKeyword(Porcupine.BuiltInKeyword.JARVIS)
          .setSensitivity(0.7f)
          .build(applicationContext) { wake() }
          manager?.start()
          show("Jarvis kekkuthu: 'Jarvis' nu sollunga")
          } catch (e: Exception) { show("Wake error: " + e.message) }
          }

          private fun wake() {
          h.post {
          try { manager?.stop() } catch (e: Exception) { }
          startActivity(Intent(this, MainActivity::class.java)
          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
          .putExtra("wake", true))
          h.postDelayed({ try { manager?.start() } catch (e: Exception) { } }, 20000)
          }
          }

          override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
          override fun onBind(i: Intent?): IBinder? = null

          override fun onDestroy() {
          try { manager?.stop(); manager?.delete() } catch (e: Exception) { }
          super.onDestroy()
          }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/jarvis/app/OrbView.kt)
          cat > app/src/main/java/com/jarvis/app/OrbView.kt <<'EOF'
          package com.jarvis.app

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.sin

          class OrbView(c: Context) : View(c) {
          var state = 0
          var level = 0f
          private val p = Paint(Paint.ANTI_ALIAS_FLAG)
          private var t = 0f

          init {
          ValueAnimator.ofFloat(0f, 6.2832f).apply {
          duration = 2000; repeatCount = ValueAnimator.INFINITE; interpolator = LinearInterpolator()
          addUpdateListener { t = it.animatedValue as Float; invalidate() }
          }.start()
          }

          override fun onDraw(cv: Canvas) {
          val cx = width / 2f; val cy = height / 2f
          val base = minOf(width, height) * 0.2f
          val col = when (state) { 1 -> 0xFF00E5FF.toInt(); 2 -> 0xFFFFB300.toInt(); else -> 0xFF3D7BFF.toInt() }
          val speed = if (state == 2) 3f else 1f
          for (i in 3 downTo 1) {
          val r = base * (1f + i * 0.3f) * (1f + 0.06f * sin(t * speed + i) + level * 0.5f)
          p.shader = null; p.color = col; p.alpha = 25 + (3 - i) * 12
          cv.drawCircle(cx, cy, r, p)
          }
          val core = base * (1f + level * 0.3f)
          p.shader = RadialGradient(cx, cy, core, 0xFFFFFFFF.toInt(), col, Shader.TileMode.CLAMP)
          p.alpha = 255
          cv.drawCircle(cx, cy, core, p)
          }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/jarvis/app/MainActivity.kt)
          cat > app/src/main/java/com/jarvis/app/MainActivity.kt <<'EOF'
          package com.jarvis.app

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.Settings
          import android.speech.RecognizerIntent
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
          private lateinit var jarvis: Jarvis
          private lateinit var orb: OrbView
          private lateinit var reply: TextView
          private var camQ = ""

          override fun onCreate(b: Bundle?) {
          super.onCreate(b)
          val prefs = getSharedPreferences("jarvis", 0)
          val dp = resources.displayMetrics.density
          fun px(v: Int) = (v * dp).toInt()
          val cyan = 0xFF00E5FF.toInt()
          val root = LinearLayout(this).apply {
          orientation = LinearLayout.VERTICAL
          setBackgroundColor(0xFF05070D.toInt()); setPadding(px(16), px(40), px(16), px(16))
          }
          reply = TextView(this).apply {
          text = "Orb-a thattunga, pesunga"; setTextColor(0xFFCFE8FF.toInt())
          textSize = 17f; gravity = Gravity.CENTER; minLines = 3
          }
          orb = OrbView(this)
          jarvis = Jarvis(this) { reply.text = it; orb.state = 0; orb.level = 0f }
          fun run(t: String) { if (t.isNotBlank()) { orb.state = 2; jarvis.handle(t) } }

          fun btn(t: String, f: (Button) -> Unit) = Button(this).apply {
          text = t; setTextColor(cyan); setBackgroundColor(0xFF0D1522.toInt()); setOnClickListener { f(this) }
          }
          fun row(vararg v: View) = LinearLayout(this).apply {
          v.forEach { addView(it, LinearLayout.LayoutParams(0, -2, 1f)) }
          }
          fun langLabel() = "Lang: " + if (prefs.getString("lang", "ta-IN") == "ta-IN") "TA" else "EN"

          val cmd = EditText(this).apply { hint = "Type command..."; setHintTextColor(0xFF607080.toInt()); setTextColor(0xFFFFFFFF.toInt()) }
          val key = EditText(this).apply {
          hint = "Gemini API key"; setHintTextColor(0xFF607080.toInt()); setTextColor(0xFFFFFFFF.toInt())
          setText(prefs.getString("key", "")); visibility = if (text.isBlank()) View.VISIBLE else View.GONE
          }
          val pkey = EditText(this).apply {
          hint = "Picovoice AccessKey"; setHintTextColor(0xFF607080.toInt()); setTextColor(0xFFFFFFFF.toInt())
          setText(prefs.getString("pkey", "")); visibility = if (text.isBlank()) View.VISIBLE else View.GONE
          }

          orb.setOnClickListener { listenOnce(prefs.getString("lang", "ta-IN") ?: "ta-IN") }
          jarvis.onCamera = { q ->
          camQ = q
          startActivityForResult(Intent(MediaStore.ACTION_IMAGE_CAPTURE), 7)
          }

          root.addView(reply)
          root.addView(orb, LinearLayout.LayoutParams(-1, 0, 1f))
          root.addView(row(
          btn("Camera") { jarvis.onCamera?.invoke(cmd.text.toString()) },
          btn(langLabel()) { prefs.edit().putString("lang", if (prefs.getString("lang", "ta-IN") == "ta-IN") "en-IN" else "ta-IN").apply(); it.text = langLabel() },
          btn("Key") {
          if (key.visibility == View.VISIBLE || pkey.visibility == View.VISIBLE) {
          prefs.edit().putString("key", key.text.toString().trim()).putString("pkey", pkey.text.toString().trim()).apply()
          key.visibility = View.GONE; pkey.visibility = View.GONE; reply.text = "Keys saved"
          } else { key.visibility = View.VISIBLE; pkey.visibility = View.VISIBLE }
          }))
          root.addView(row(
          btn("Wake ON") {
          if (prefs.getString("pkey", "").isNullOrBlank()) reply.text = "Mudhalla Picovoice key podunga (Key button)"
          else { startForegroundService(Intent(this, JarvisService::class.java)); reply.text = "'Jarvis' nu sollunga, kekkuthu" }
          },
          btn("Wake OFF") { stopService(Intent(this, JarvisService::class.java)); reply.text = "Wake off" }))
          root.addView(row(
          btn("Voice") { jarvis.nextVoice() },
          btn("Overlay") { startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))) },
          btn("Battery") { startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)) }))
          root.addView(key)
          root.addView(pkey)
          root.addView(row(cmd, btn("Send") { run(cmd.text.toString()); cmd.setText("") }))
          setContentView(root)

          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.CALL_PHONE,
          Manifest.permission.SEND_SMS, Manifest.permission.READ_CONTACTS, Manifest.permission.POST_NOTIFICATIONS), 1)
          handleWake(intent)
          }

          override fun onNewIntent(intent: Intent?) {
          super.onNewIntent(intent)
          setIntent(intent)
          handleWake(intent)
          }

          private fun handleWake(i: Intent?) {
          if (i == null || !i.getBooleanExtra("wake", false)) return
          i.removeExtra("wake")
          if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true) }
          orb.post { listenOnce(getSharedPreferences("jarvis", 0).getString("lang", "ta-IN") ?: "ta-IN") }
          }

          private fun listenOnce(lang: String) {
          try {
          startActivityForResult(recognizerIntent(lang).putExtra(RecognizerIntent.EXTRA_PROMPT, "Pesunga..."), 9)
          } catch (e: Exception) { jarvis.say("Google app illa, type panni Send thattunga") }
          }

          @Suppress("DEPRECATION")
          override fun onActivityResult(req: Int, res: Int, data: Intent?) {
          super.onActivityResult(req, res, data)
          if (res != RESULT_OK) { orb.state = 0; return }
          if (req == 9) {
          val t = data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull().orEmpty()
          if (t.isNotBlank()) { reply.text = t; orb.state = 2; jarvis.handle(t) }
          } else if (req == 7) {
          val bmp = data?.extras?.get("data") as? Bitmap
          if (bmp != null) { orb.state = 2; jarvis.askImage(bmp, camQ) }
          }
          }

          override fun onDestroy() { jarvis.shutdown(); super.onDestroy() }
          }
          EOF
      - name: Build APK
        working-directory: JarvisApp
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: JarvisApp/app/build/outputs/apk/debug/app-debug.apk
